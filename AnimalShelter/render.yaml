services:
  - type: web
    name: AnimalShelterBack
    runtime: java
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/AnimalShelter-0.0.1-SNAPSHOT.jar
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false